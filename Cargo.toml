[package]
name = "litellm-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Local endpoint relay for routing and auditing AI app traffic through LiteLLM Gateway."

[[bin]]
name = "litellm-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "ws", "query"] }
futures-util = { version = "0.3", features = ["sink"] }
regex = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
anyhow = "1.0"
base64 = "0.22"
brotli = "7.0"
jiff = { version = "1", default-features = false, features = ["std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
flate2 = "1.0"
plist = "1.10.1"
reqwest = { version = "0.13.2", default-features = false, features = ["cookies", "json", "form", "rustls-no-provider"] }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "9043cdfa8694d83bf506c2f3eb0313ec173edd7e", default-features = false, features = ["client", "server", "elicitation", "transport-io", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize", "serialize"] }
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml_edit = "0.22"
url = { version = "2.5", features = ["serde"] }
percent-encoding = "2.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
webpki-roots = "1"
zstd = "0.14.3"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "9043cdfa8694d83bf506c2f3eb0313ec173edd7e", default-features = false, features = ["server", "transport-streamable-http-server", "transport-child-process"] }
tokio = { version = "1.53.3", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3.7"
