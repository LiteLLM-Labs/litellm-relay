services:
  remote:
    build: .
    restart: unless-stopped
    environment:
      LITELLM_GATEWAY_URL: ${LITELLM_GATEWAY_URL:?Set your LiteLLM gateway URL}
      REMOTE_PUBLIC_URL: ${REMOTE_PUBLIC_URL:?Set the remote service HTTPS URL}
    ports:
      - 127.0.0.1:4174:4174
    volumes:
      - remote-state:/app/data
volumes:
  remote-state:
